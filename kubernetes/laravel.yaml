apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel
  namespace: devops-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel
  template:
    metadata:
      labels:
        app: laravel
    spec:
      initContainers:
        - name: clone-project
          image: alpine/git:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              git clone --depth 1 \
                https://github.com/ahmerabbas7272-commits/jenkinslab.git \
                /app
          volumeMounts:
            - name: laravel-files
              mountPath: /app

        - name: install-dependencies
          image: composer:2
          command:
            - /bin/sh
            - -c
            - |
              set -e
              cd /app
              composer install --no-interaction --prefer-dist --no-progress --optimize-autoloader
              mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
              chmod -R a+rwX storage bootstrap/cache
          volumeMounts:
            - name: laravel-files
              mountPath: /app

      containers:
        - name: laravel
          image: serversideup/php:8.4-fpm-nginx
          ports:
            - containerPort: 8080
          env:
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: "http://localhost:30080"
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: APP_KEY
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "mysql-service"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "laravel_db"
            - name: DB_USERNAME
              value: "laravel_user"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: laravel-secret
                  key: DB_PASSWORD
            - name: SESSION_DRIVER
              value: "file"
            - name: CACHE_STORE
              value: "file"
            - name: LOG_CHANNEL
              value: "stderr"
            - name: AUTORUN_ENABLED
              value: "false"
          volumeMounts:
            - name: laravel-files
              mountPath: /var/www/html
      volumes:
        - name: laravel-files
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: laravel-service
  namespace: devops-lab
spec:
  type: NodePort
  selector:
    app: laravel
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
